{% extends "base.html" %}

{% block content %}
<div class="pure-g">
    <div class="pure-u-1 pure-u-md-1-2" style="margin: 0 auto; max-width: 600px; padding-top: 30px;">
        <h2 style="border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">My Profile</h2>

        <div style="background: #f9f9f9; padding: 25px; border-radius: 8px; border: 1px solid #ddd;">
            <p><strong>Username:</strong> {{ current_user.username }}</p>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <h3 style="color: #dc3545; margin-top: 0;">Delete Account</h3>
            <p style="font-size: 0.9em; color: #666;">
                Deleting your account is permanent. All your properties, stands, and associated data will be completely
                wiped from the system. This action cannot be undone.
            </p>

            <form action="{{ url_for('main.delete_account') }}" method="POST" style="margin-top: 15px;">
                <button type="submit" class="pure-button" style="background: #dc3545; color: white; font-weight: bold;"
                    onclick="return confirm('WARNING: Are you absolutely sure you want to PERMANENTLY delete your account? All data will be lost.');">
                    Permanently Delete Account
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
